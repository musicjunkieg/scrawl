<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Scrawl web send test</title>
    <style>
      body { font: 16px system-ui; margin: 40px; max-width: 640px; }
      button { font-size: 16px; padding: 8px 16px; margin-right: 8px; }
      #status { margin-top: 20px; padding: 12px; background: #f2f2f5; border-radius: 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Scrawl web send test</h1>
    <p>Press Record and share this tab. Click the counter, hold ⇧ and move the pointer to draw, then
      press Stop and Send. The recording goes to this page's server, which passes it on to your
      Scrawl server.</p>
    <button id="record">Record</button>
    <button id="stop" disabled>Stop and Send</button>
    <p><button id="count">Clicked 0 times</button></p>
    <div id="status">Not recording.</div>
    <script type="module">
      import { createScrawl } from "/src/index.js";

      const scrawl = createScrawl({ context: { test: "web send" } });
      const status = document.getElementById("status");
      const record = document.getElementById("record");
      const stop = document.getElementById("stop");
      let clicks = 0;
      document.getElementById("count").onclick = (event) => {
        clicks += 1;
        event.target.textContent = clicks === 1 ? "Clicked 1 time" : `Clicked ${clicks} times`;
      };
      record.onclick = async () => {
        try {
          await scrawl.start();
          record.disabled = true;
          stop.disabled = false;
          status.textContent = "Recording…";
        } catch (error) {
          status.textContent = `Recording didn't start: ${error.message}`;
        }
      };
      stop.onclick = async () => {
        stop.disabled = true;
        try {
          status.textContent = "Building the bundle…";
          const bundle = await scrawl.stop();
          status.textContent = "Sending to your Scrawl server…";
          const reply = await bundle.send({ url: "/api/scrawl" });
          status.textContent = `Sent to your Scrawl server: ${reply.id} (${reply.state})`;
        } catch (error) {
          status.textContent = `Not sent: ${error.message}`;
        } finally {
          record.disabled = false;
        }
      };
    </script>
  </body>
</html>
