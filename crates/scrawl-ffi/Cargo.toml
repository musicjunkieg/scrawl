[package]
name = "scrawl-ffi"
version = "0.3.5"
edition = "2024"
license = "MIT"
repository = "https://github.com/musicjunkieg/scrawl"
description = "Scrawl's bundle compiler for apps, through a C interface (include/scrawl.h): a capture's frames, ink, events and transcript in, the .scrawl bundle's files out. ScrawlKit builds it into ScrawlCore.xcframework."
# Built into ScrawlKit's xcframework, not published to crates.io.
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
scrawl-core = { path = "../scrawl-core", version = "0.3.5" }
serde_json = "1.0.151"
