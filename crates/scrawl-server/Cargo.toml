[package]
name = "scrawl-server"
version = "0.3.5"
edition = "2024"
license = "MIT"
repository = "https://github.com/musicjunkieg/scrawl"
description = "Scrawl's receiver: takes uploaded .scrawl bundles, keeps them and hands them to agents. No OS bindings, so it runs on Cloudflare Workers (workers/scrawl-server) as well as anywhere else."
publish = false

[dependencies]
base64 = "0.22.1"
flate2 = "1.1.10"
hmac = "0.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
