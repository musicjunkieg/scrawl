[package]
name = "scrawl-capture"
version = "0.3.5"
edition = "2024"
license = "MIT"
description = "What a Scrawl capture records: traits for screen, audio, window-log and transcription sources, and the recordings they hand back."

[dependencies]
anyhow = "1.0.104"
hound = "3.5.1"
scrawl-bundle = { path = "../scrawl-bundle" }

[dev-dependencies]
serde_json = "1.0.151"

[features]
default = ["native"]
# The macOS and Windows sources (`native`): the window server's window list, and the Windows
# display and window helpers. Without it, and on other systems (Linux, wasm), the crate has no
# OS bindings at all.
native = [
  "dep:core-foundation",
  "dep:core-graphics",
  "dep:objc2",
  "dep:objc2-app-kit",
  "dep:objc2-foundation",
  "dep:windows",
]

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.10.0", optional = true }
core-graphics = { version = "0.24.0", optional = true }
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", optional = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
