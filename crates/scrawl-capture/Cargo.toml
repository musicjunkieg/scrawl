[package]
name = "scrawl-capture"
version = "0.3.5"
edition = "2024"
license = "MIT"
description = "What a Scrawl capture records: traits for screen, audio, window-log and transcription sources, and the recordings they hand back."

[dependencies]
anyhow = "1.0.104"
hound = "3.5.1"
scrawl-bundle = { path = "../scrawl-bundle" }

[dev-dependencies]
serde_json = "1.0.151"

[features]
default = ["native"]
# The macOS and Windows sources (`native`): the window server's window list, the microphone
# (`cpal`), the screen recorders (ScreenCaptureKit on macOS; Windows.Graphics.Capture and Media
# Foundation on Windows), and the Windows display and window helpers. Without it, and on other systems (Linux,
# wasm), the crate has no OS bindings at all.
native = [
  "dep:core-foundation",
  "dep:core-graphics",
  "dep:cpal",
  "dep:objc2",
  "dep:objc2-app-kit",
  "dep:objc2-foundation",
  "dep:screencapturekit",
  "dep:windows",
]

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.10.0", optional = true }
core-graphics = { version = "0.24.0", optional = true }
cpal = { version = "0.18.2", optional = true }
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }
screencapturekit = { version = "=11.0.0", optional = true, features = ["macos_15_0"] }

[target.'cfg(target_os = "windows")'.dependencies]
cpal = { version = "0.18.2", optional = true }
windows = { version = "0.61.3", optional = true, features = [
  "Foundation",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Media_MediaFoundation",
  "Win32_System_Performance",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
