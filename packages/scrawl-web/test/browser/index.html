<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Scrawl web test page</title>
    <style>
      body { font: 16px system-ui; margin: 0; background: #f4f4f8; }
      main { padding: 40px; }
      .card { width: 260px; height: 140px; background: #2b6cdf; color: white; border-radius: 12px; padding: 16px; transition: transform 200ms; }
      .card.moved { transform: translateX(240px); }
      button { font-size: 18px; padding: 10px 18px; margin-top: 24px; }
    </style>
  </head>
  <body>
    <main>
      <div class="card" id="card">A card</div>
      <button id="move" data-source-loc="src/Card.tsx:12:5" onclick="document.getElementById('card').classList.toggle('moved')">Move the card</button>
    </main>
  </body>
</html>
