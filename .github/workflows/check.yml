name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install the Metal toolchain
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - run: cargo build --locked
      - run: cargo test --locked

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --locked
      - run: cargo test --locked
      - uses: actions/upload-artifact@v5
        with:
          name: scrawl-windows-x86_64
          path: target/debug/scrawl.exe

  core:
    name: Linux core and wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # The bundle format, capture traits and compiler build with no OS bindings, so other apps (and
      # wasm) can use them.
      - run: cargo test --locked -p scrawl-bundle -p scrawl-capture -p scrawl-core -p scrawl-route -p scrawl-wasm
      - run: cargo build --locked -p scrawl-capture -p scrawl-core -p scrawl-route --target wasm32-unknown-unknown
      # The browser build: compile a bundle in Node through wasm-bindgen's JS glue. The CLI's
      # version must match the `wasm-bindgen` in Cargo.lock.
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.129
      - run: cargo build --locked -p scrawl-wasm --release --target wasm32-unknown-unknown
      - run: wasm-bindgen --target nodejs --out-dir target/scrawl-wasm-node target/wasm32-unknown-unknown/release/scrawl_wasm.wasm
      - run: node crates/scrawl-wasm/tests/node.mjs target/scrawl-wasm-node
