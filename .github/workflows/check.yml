name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install the Metal toolchain
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - run: cargo build --locked
      - run: cargo test --locked

  scrawlkit:
    name: ScrawlKit
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # Without ScrawlCore, ScrawlKit builds as it always has.
      - run: swift build
        env:
          SCRAWL_CORE: "0"
      # The bundle compiler for apps, crates/scrawl-ffi, as ScrawlCore.xcframework.
      - run: scripts/build-xcframework.sh
      - run: swift test
        env:
          SCRAWL_CORE: "1"
      - run: xcodebuild -list
        env:
          SCRAWL_CORE: "1"
      - run: xcodebuild build -scheme ScrawlKit -destination 'generic/platform=iOS' -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
        env:
          SCRAWL_CORE: "1"
      # The demo app (Examples/ScrawlDemo.swiftpm), which picks ScrawlCore up from target/.
      - run: xcodebuild build -scheme ScrawlDemo -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
        working-directory: Examples/ScrawlDemo.swiftpm
        env:
          SCRAWL_CORE: "1"

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --locked
      - run: cargo test --locked
      - uses: actions/upload-artifact@v5
        with:
          name: scrawl-windows-x86_64
          path: target/debug/scrawl.exe

  core:
    name: Linux core and wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # The bundle format, capture traits and compiler build with no OS bindings, so other apps (and
      # wasm) can use them.
      - run: cargo test --locked -p scrawl-bundle -p scrawl-capture -p scrawl-core -p scrawl-route -p scrawl-wasm -p scrawl-ffi
      # The C interface ScrawlKit builds on: a bundle through include/scrawl.h, under AddressSanitizer.
      - run: cargo build --locked -p scrawl-ffi
      - run: crates/scrawl-ffi/tests/smoke.sh
      - run: cargo build --locked -p scrawl-capture -p scrawl-core -p scrawl-route --target wasm32-unknown-unknown
      # The browser build: compile a bundle in Node through wasm-bindgen's JS glue. The CLI's
      # version must match the `wasm-bindgen` in Cargo.lock.
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.129
      - run: cargo build --locked -p scrawl-wasm --release --target wasm32-unknown-unknown
      - run: wasm-bindgen --target nodejs --out-dir target/scrawl-wasm-node target/wasm32-unknown-unknown/release/scrawl_wasm.wasm
      - run: node crates/scrawl-wasm/tests/node.mjs target/scrawl-wasm-node

  web:
    name: Web package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The CLI's version must match the `wasm-bindgen` in Cargo.lock.
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.129
      - run: packages/scrawl-web/scripts/build-wasm.sh
      - run: npm test
        working-directory: packages/scrawl-web
      # Records the test page in Chromium: tab capture, a click, ⇧ ink, a fake transcriber.
      - run: npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
      - run: "\"$RUNNER_TEMP/pw/node_modules/.bin/playwright\" install --with-deps chromium"
      - run: node test/browser/run.mjs "$RUNNER_TEMP/bundle"
        working-directory: packages/scrawl-web
        timeout-minutes: 5
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
