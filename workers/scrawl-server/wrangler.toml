# The receiver on Cloudflare Workers. README.md here has the steps.
name = "scrawl-server"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

[build]
command = "cargo install -q worker-build@^0.8 && worker-build --release"

# Where bundles are kept: `npx wrangler r2 bucket create scrawl-bundles` makes it.
[[r2_buckets]]
binding = "BUNDLES"
bucket_name = "scrawl-bundles"

[vars]
# The largest upload, in bytes (40 MB). A Worker has 128 MB of memory and holds an upload about
# twice while unpacking it, so raise this with care (Workers itself takes up to 100 MB).
MAX_UPLOAD_BYTES = "41943040"
